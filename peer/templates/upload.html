<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NightOwls — Upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="{{ url_for('home') }}">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">NightOwls</span>
        </a>
        <nav class="nav">
          <a href="{{ url_for('home') }}">Browse</a>
          <a class="active" href="{{ url_for('upload_page') }}">Upload</a>
        </nav>
      </header>

      <section class="hero">
        <h1>Seed a file</h1>
        <p>Drop a file to chunk, hash, and announce it to the tracker. Your peer will serve pieces to others.</p>
      </section>

      <section class="panel">
        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload file">
          <h2>Drag & drop</h2>
          <p>or click to choose a file from your machine</p>
          <p class="hint">Any size — split into 256 KB chunks with SHA-256 verification</p>
        </div>
        <input type="file" id="file-input" />
        <div class="status" id="upload-status">Waiting for a file…</div>
        <div style="margin-top: 1rem">
          <button type="button" class="btn btn-primary" id="upload-btn" disabled>Upload & seed</button>
        </div>
      </section>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Tracker portal{% endblock %} — Campus Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}" />
  </head>
  <body class="bg-[#111111] text-[#f8f4e8]">
    <header class="bar">
      <strong><span>CC</span> Campus Connect <em>tracker</em></strong>
      <nav>
        <a href="{{ url_for('portal_home') }}">Home</a>
        <a href="{{ url_for('portal_inventory') }}">Inventory</a>
        <a href="{{ url_for('portal_audit') }}">Audit</a>
      </nav>
    </header>
    <main class="wrap">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <ul class="flash">
        {% for cat, msg in messages %}
        <li class="{{ cat }}">{{ msg }}</li>
        {% endfor %}
      </ul>
      {% endif %}
      {% endwith %}
      {% block body %}{% endblock %}
    </main>
  </body>
</html>
